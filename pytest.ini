[pytest]
testpaths = tests
# Microsoft Word (used to convert PDF/.doc resumes) raises and handles COM "RPC unavailable" errors
# internally when it shuts down. pytest's faulthandler prints those handled errors as scary stack dumps
# on Windows, so it is turned off here. Real failures still fail the tests normally.
addopts = -q -p no:faulthandler
filterwarnings =
    ignore:.*fitz.*:FutureWarning
    ignore::DeprecationWarning:docxcompose.*
